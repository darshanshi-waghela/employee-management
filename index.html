<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f2f4f8; margin: 0; padding: 20px; color: #222; }
    .container { max-width: 900px; margin: auto; }
    h1 { text-align: center; }
    .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.15); }
    input { padding: 10px; margin: 5px 0; width: 100%; border: 1px solid #bbb; border-radius: 5px; font-size: 14px; }
    button { padding: 9px 16px; margin: 5px 5px 5px 0; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; color: #fff; background: #2563eb; }
    button.green { background: #16a34a; }
    button.red { background: #dc2626; }
    button.grey { background: #6b7280; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background: #eef1f6; }
    #msg { padding: 10px; border-radius: 5px; margin-bottom: 15px; display: none; }
    #msg.ok { display: block; background: #dcfce7; color: #166534; }
    #msg.err { display: block; background: #fee2e2; color: #991b1b; }
    .top { display: flex; justify-content: space-between; align-items: center; }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>Employee Management System</h1>
  <div id="msg"></div>

  <!-- LOGIN SECTION -->
  <div id="loginView" class="card">
    <h2>Login or Register</h2>
    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button onclick="doLogin()">Login</button>
    <button class="green" onclick="doRegister()">Register</button>
  </div>

  <!-- MAIN SECTION -->
  <div id="mainView" class="hidden">
    <div class="card">
      <div class="top">
        <h2 id="formTitle">Add Employee</h2>
        <button class="grey" onclick="doLogout()">Logout</button>
      </div>
      <div class="grid">
        <input id="name" type="text" placeholder="Name">
        <input id="email" type="text" placeholder="Email">
        <input id="department" type="text" placeholder="Department">
        <input id="position" type="text" placeholder="Position">
      </div>
      <button id="saveBtn" class="green" onclick="saveEmployee()">Add Employee</button>
      <button id="cancelBtn" class="grey hidden" onclick="resetForm()">Cancel Edit</button>
    </div>

    <div class="card">
      <div class="top">
        <h2>All Employees</h2>
        <button onclick="loadEmployees()">Refresh</button>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Position</th><th>Actions</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      <p id="emptyText" class="hidden">No employees yet. Add one above.</p>
    </div>
  </div>
</div>

<script>
  var editId = null;

  function $(id) { return document.getElementById(id); }

  function showMsg(text, ok) {
    var m = $("msg");
    m.textContent = text;
    m.className = ok ? "ok" : "err";
    setTimeout(function () { m.className = ""; }, 4000);
  }

  async function api(path, method, body) {
    var options = { method: method || "GET", headers: { "Content-Type": "application/json" }, credentials: "same-origin" };
    if (body) { options.body = JSON.stringify(body); }
    var res = await fetch(path, options);
    var data = {};
    try { data = await res.json(); } catch (e) { data = {}; }
    return { ok: res.ok, status: res.status, data: data };
  }

  function showLogin() {
    $("loginView").classList.remove("hidden");
    $("mainView").classList.add("hidden");
  }

  function showMain() {
    $("loginView").classList.add("hidden");
    $("mainView").classList.remove("hidden");
  }

  async function doRegister() {
    var u = $("username").value.trim();
    var p = $("password").value;
    var r = await api("/register", "POST", { username: u, password: p });
    if (r.ok) {
      showMsg("Registered! Logging you in...", true);
      await doLogin();
    } else {
      showMsg(r.data.error || "Registration failed", false);
    }
  }

  async function doLogin() {
    var u = $("username").value.trim();
    var p = $("password").value;
    var r = await api("/login", "POST", { username: u, password: p });
    if (r.ok) {
      showMsg("Logged in", true);
      showMain();
      loadEmployees();
    } else {
      showMsg(r.data.error || "Login failed", false);
    }
  }

  async function doLogout() {
    await api("/logout", "POST");
    $("password").value = "";
    resetForm();
    showLogin();
    showMsg("Logged out", true);
  }

  // READ
  async function loadEmployees() {
    var r = await api("/employees");
    if (r.status === 401) { showLogin(); return; }
    showMain();
    var body = $("tableBody");
    body.innerHTML = "";
    var list = Array.isArray(r.data) ? r.data : [];
    $("emptyText").classList.toggle("hidden", list.length > 0);
    list.forEach(function (emp) {
      var tr = document.createElement("tr");
      [emp.id, emp.name, emp.email, emp.department || "", emp.position || ""].forEach(function (value) {
        var td = document.createElement("td");
        td.textContent = value;
        tr.appendChild(td);
      });
      var actions = document.createElement("td");
      var editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.onclick = function () { startEdit(emp); };
      var delBtn = document.createElement("button");
      delBtn.textContent = "Delete";
      delBtn.className = "red";
      delBtn.onclick = function () { deleteEmployee(emp.id); };
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      tr.appendChild(actions);
      body.appendChild(tr);
    });
  }

  // CREATE and UPDATE
  async function saveEmployee() {
    var payload = {
      name: $("name").value.trim(),
      email: $("email").value.trim(),
      department: $("department").value.trim(),
      position: $("position").value.trim()
    };
    var r;
    if (editId === null) {
      r = await api("/employees", "POST", payload);
    } else {
      r = await api("/employees/" + editId, "PUT", payload);
    }
    if (r.ok) {
      showMsg(editId === null ? "Employee added" : "Employee updated", true);
      resetForm();
      loadEmployees();
    } else {
      showMsg(r.data.error || "Something went wrong", false);
    }
  }

  function startEdit(emp) {
    editId = emp.id;
    $("name").value = emp.name;
    $("email").value = emp.email;
    $("department").value = emp.department || "";
    $("position").value = emp.position || "";
    $("formTitle").textContent = "Edit Employee (ID " + emp.id + ")";
    $("saveBtn").textContent = "Save Changes";
    $("cancelBtn").classList.remove("hidden");
    window.scrollTo(0, 0);
  }

  function resetForm() {
    editId = null;
    ["name", "email", "department", "position"].forEach(function (id) { $(id).value = ""; });
    $("formTitle").textContent = "Add Employee";
    $("saveBtn").textContent = "Add Employee";
    $("cancelBtn").classList.add("hidden");
  }

  // DELETE
  async function deleteEmployee(id) {
    if (!confirm("Delete employee " + id + "?")) { return; }
    var r = await api("/employees/" + id, "DELETE");
    if (r.ok) {
      showMsg("Employee deleted", true);
      loadEmployees();
    } else {
      showMsg("Could not delete", false);
    }
  }

  // When the page opens, check if already logged in
  loadEmployees();
</script>
</body>
</html>
